services:
  contextual-support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextual-support-agent
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      GROQ_MODEL: ${GROQ_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      HISTORY_PROVIDER: ${HISTORY_PROVIDER:-hindsight}
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      AGENT_NAME: ${AGENT_NAME:-Support Assistant}
      AGENT_PERSONA: ${AGENT_PERSONA:-You are a helpful, concise customer support agent.}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      ANALYTICS_DB_PATH: ${ANALYTICS_DB_PATH:-data/analytics.sqlite3}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      APP_ENV: ${APP_ENV:-docker}
    volumes:
      - analytics-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8); raise SystemExit(0 if 'healthy' in r.read().decode() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  analytics-data:
